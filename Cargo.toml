[package]
name = "tc-error"
version = "0.13.1"
authors = ["code@tinychain.net"]
edition = "2021"
description = "TinyChain's generic error struct"
license = "Apache-2.0"
repository = "https://github.com/haydnv/tinychain.git"
readme = "README.md"

keywords = ["tinychain", "error", "service", "mesh"]
categories = ["rust-patterns"]

[dependencies]
destream = { path = "../deps/destream", version = "0.10" }
ha-ndarray = { path = "../deps/ha-ndarray", version = "0.5", optional = true }
log = { version = "0.4", features = ["release_max_level_info"] }
pathlink = { path = "../deps/pathlink", optional = true }
rjwt = { version = "0.6", optional = true }
serde = "1.0"
txn_lock = { path = "../deps/txn_lock", version = "0.11", optional = true }
txfs = { path = "../deps/txfs", version = "~0.5.1", optional = true }

[features]
pathlink = ["dep:pathlink"]
txfs = ["dep:txfs"]

[dev-dependencies]
bytes = "1"
destream_json = { path = "../deps/destream_json", version = "0.15" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
